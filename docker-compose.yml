services:
  certificate-web:
    build:
      context: .
      dockerfile: src/CertificateDiscovery.Web/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    volumes:
      - certificate_sqlite:/data
    networks:
      - certificate_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  certificate-worker:
    build:
      context: .
      dockerfile: workers/certificate-discovery-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.example
    depends_on:
      certificate-web:
        condition: service_healthy
    networks:
      - certificate_network

  certificate-range-worker:
    build:
      context: .
      dockerfile: workers/certificate-discovery-worker/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "worker.range_main"]
    env_file:
      - .env.example
    environment:
      WORKER_NAME: certificate-range-worker-1
      WORKER_MAX_CONCURRENCY: 100
      WORKER_POLL_INTERVAL_SECONDS: 10
    depends_on:
      certificate-web:
        condition: service_healthy
    networks:
      - certificate_network

  vault:
    image: hashicorp/vault:1.17
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    networks:
      - certificate_network

volumes:
  certificate_sqlite:

networks:
  certificate_network:
    driver: bridge
